# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
imports:
  - cloud-config

nixpkgs:
  allow_unfree: true
  permitted_insecure_packages:
    - python3.14-ecdsa-0.19.2

inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

  nixpkgs-multiverse:
    url: github:fzakaria/nixpkgs-multiverse

  cloud-config:
    url: github:id-unibe-ch/cloud-azure-devenv-config?dir=terraform-config&ref=v2
    flake: false

  git-hooks:
    url: github:cachix/git-hooks.nix
