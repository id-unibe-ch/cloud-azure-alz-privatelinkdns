---
name: 02 Azure Landing Zones Continuous Delivery
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Terraform Action to perform"
        required: true
        default: "apply"
        type: choice
        options:
          - "apply"
          - "destroy"

jobs:
  plan_and_apply:
    uses: id-unibe-ch/cloud-azure-alz-templates/.github/workflows/cd-template.yaml@main
    name: "CD"
    permissions:
      id-token: write
      contents: read
    with:
      terraform_action: ${{ inputs.terraform_action }}
      root_module_folder_relative_path: "."
      devenv_enable: true
    secrets: inherit
